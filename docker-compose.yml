#
# docker-compose.yml — Hermes Agent (Multi-tenant)
#
# Orchestrates two isolated hermes-agent instances, one for Tim and one for Chrisann.
# Each instance connects to its own dedicated LiteLLM proxy and Obsidian vault.
#
# Usage:
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose up -d
#
# Prerequisites:
#   - The LiteLLM proxy stack must be running first:
#     cd /home/cia-one/dev/litellm && docker compose up -d
#   - The litellm_default external network must exist (created automatically
#     by the litellm stack). If it doesn't yet exist, run:
#     docker network create litellm_default
#
# Strict Isolation:
#   - agent-tim  → only talks to litellm-tim  (port 4001)
#   - agent-chrisann → only talks to litellm-chrisann (port 4002)
#   - Each agent has its own HERMES_HOME at ./data/tim/hermes or ./data/chrisann/hermes
#   - Each agent has its own Obsidian vault (read-only mount)
#

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # TIM'S AGENT (Gateway)
  # ─────────────────────────────────────────────────────────────────────────────
  agent-tim:
    build: .
    image: hermes-agent
    container_name: hermes-tim
    restart: unless-stopped
    networks:
      - litellm_default
    depends_on:
      searxng:
        condition: service_healthy
      ntfy:
        condition: service_healthy
    volumes:
      # Tim's isolated HERMES_HOME — all memory, sessions, and config live here
      - ./data/tim/hermes:/opt/data
      # Tim's Obsidian vault — read-only access
      - ./data/tim/obsidian:/opt/data/obsidian
      - /home/cia-one/dev/obsidian-mcp-server/obsidian-mcp-server:/opt/obsidian-mcp-server:ro
      # Tim's website — read-write so the agent can edit pages directly
      # Changes to index.html / style.css are live immediately (no rebuild needed)
      - /home/cia-one/dev/villagertim-website:/opt/website
      - ./mcp-servers/litellm-spend:/opt/mcp-servers/litellm-spend:ro

    env_file:
      - .tim-agent.env
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
    command: [ "gateway", "run" ]
    deploy:
      resources:
        limits:
          memory: 1024M

  # ─────────────────────────────────────────────────────────────────────────────
  # TIM'S AGENT (Dashboard)
  # ─────────────────────────────────────────────────────────────────────────────
  agent-tim-dashboard:
    image: hermes-agent
    container_name: hermes-tim-dashboard
    restart: unless-stopped
    networks:
      - litellm_default
    depends_on:
      agent-tim:
        condition: service_started
    volumes:
      - ./data/tim/hermes:/opt/data
      - ./data/tim/obsidian:/opt/data/obsidian
      - /home/cia-one/dev/obsidian-mcp-server/obsidian-mcp-server:/opt/obsidian-mcp-server:ro
      # Tim's website — read-write so the agent can edit pages directly
      - /home/cia-one/dev/villagertim-website:/opt/website
      - ./plugins/litellm-budget:/opt/hermes/plugins/litellm-budget:ro
    env_file:
      - .tim-agent.env
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - BUDGET_SCOPE=all
    secrets:
      - litellm_master_key

    command: [ "dashboard", "--host", "0.0.0.0", "--port", "9119", "--insecure", "--no-open" ]
    deploy:
      resources:
        limits:
          memory: 768M

  # ─────────────────────────────────────────────────────────────────────────────
  # CHRISANN'S AGENT (Gateway)
  # ─────────────────────────────────────────────────────────────────────────────
  agent-chrisann:
    build: .
    image: hermes-agent
    container_name: hermes-chrisann
    restart: unless-stopped
    networks:
      - litellm_default
    depends_on:
      searxng:
        condition: service_healthy
      ntfy:
        condition: service_healthy
    volumes:
      # Chrisann's isolated HERMES_HOME — all memory, sessions, and config live here
      - ./data/chrisann/hermes:/opt/data
      # Chrisann's Obsidian vault — read-only access
      - ./data/chrisann/obsidian:/opt/data/obsidian
      - /home/cia-one/dev/obsidian-mcp-server/obsidian-mcp-server:/opt/obsidian-mcp-server:ro
      # Chrisann's website — read-write so the agent can edit pages directly
      # Changes to index.html / style.css are live immediately (no rebuild needed)
      - /home/cia-one/dev/villagerchrisann-website:/opt/website
      - ./mcp-servers/litellm-spend:/opt/mcp-servers/litellm-spend:ro

    env_file:
      - .chrisann-agent.env
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
    command: [ "gateway", "run" ]
    deploy:
      resources:
        limits:
          memory: 1024M

  # ─────────────────────────────────────────────────────────────────────────────
  # CHRISANN'S AGENT (Dashboard)
  # ─────────────────────────────────────────────────────────────────────────────
  agent-chrisann-dashboard:
    image: hermes-agent
    container_name: hermes-chrisann-dashboard
    restart: unless-stopped
    networks:
      - litellm_default
    depends_on:
      agent-chrisann:
        condition: service_started
    volumes:
      - ./data/chrisann/hermes:/opt/data
      - ./data/chrisann/obsidian:/opt/data/obsidian
      - /home/cia-one/dev/obsidian-mcp-server/obsidian-mcp-server:/opt/obsidian-mcp-server:ro
      # Chrisann's website — read-write so the agent can edit pages directly
      - /home/cia-one/dev/villagerchrisann-website:/opt/website
      - ./plugins/litellm-budget:/opt/hermes/plugins/litellm-budget:ro
    env_file:
      - .chrisann-agent.env
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - BUDGET_SCOPE=self
    secrets:
      - litellm_master_key

    command: [ "dashboard", "--host", "0.0.0.0", "--port", "9119", "--insecure", "--no-open" ]
    deploy:
      resources:
        limits:
          memory: 768M

  # ─────────────────────────────────────────────────────────────────────────────
  # TIM'S AGENT (Obsidian Web GUI)
  # ─────────────────────────────────────────────────────────────────────────────
  obsidian-gui-tim:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian-gui-tim
    restart: unless-stopped
    profiles: [gui]   # Opt-in: docker compose --profile gui up -d
    networks:
      - litellm_default
    environment:
      - PUID=${HERMES_UID:-1000}
      - PGID=${HERMES_GID:-1000}
      - TZ=Etc/UTC
      - PASSWORD=${OBSIDIAN_PASSWORD_TIM}
      - CUSTOM_HTTPS_PORT=443
    volumes:
      - ./data/tim/obsidian-gui-config:/config
      - ./data/tim/obsidian:/config/vault
      - ./selkies-nginx-noauth.conf:/etc/nginx/sites-enabled/default:ro
    deploy:
      resources:
        limits:
          memory: 512M

  # ─────────────────────────────────────────────────────────────────────────────
  # CHRISANN'S AGENT (Obsidian Web GUI)
  # ─────────────────────────────────────────────────────────────────────────────
  obsidian-gui-chrisann:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian-gui-chrisann
    restart: unless-stopped
    profiles: [gui]   # Opt-in: docker compose --profile gui up -d
    networks:
      - litellm_default
    environment:
      - PUID=${HERMES_UID:-1000}
      - PGID=${HERMES_GID:-1000}
      - TZ=Etc/UTC
      - PASSWORD=${OBSIDIAN_PASSWORD_CHRISANN}
      - CUSTOM_HTTPS_PORT=443
    volumes:
      - ./data/chrisann/obsidian-gui-config:/config
      - ./data/chrisann/obsidian:/config/vault
      - ./selkies-nginx-noauth.conf:/etc/nginx/sites-enabled/default:ro
    deploy:
      resources:
        limits:
          memory: 512M

  # ─────────────────────────────────────────────────────────────────────────────
  # TIM'S AGENT (n8n)
  # ─────────────────────────────────────────────────────────────────────────────
  n8n-tim:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-tim
    restart: unless-stopped
    networks:
      - litellm_default
    volumes:
      - ./data/tim/n8n_data:/home/node/.n8n
    deploy:
      resources:
        limits:
          memory: 512M

  # ─────────────────────────────────────────────────────────────────────────────
  # CHRISANN'S AGENT (n8n)
  # ─────────────────────────────────────────────────────────────────────────────
  n8n-chrisann:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-chrisann
    restart: unless-stopped
    networks:
      - litellm_default
    volumes:
      - ./data/chrisann/n8n_data:/home/node/.n8n
    deploy:
      resources:
        limits:
          memory: 512M


  # ─────────────────────────────────────────────────────────────────────────────
  # SEARXNG — Self-Hosted Web Search (Shared)
  # Privacy-respecting metasearch engine aggregating Google, Bing, DuckDuckGo,
  # Brave, and more. Shared by both agents — no user data, just search queries.
  # JSON format is pre-enabled in settings.yml (required by hermes-agent).
  # ─────────────────────────────────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    networks:
      - litellm_default
    volumes:
      - ./data/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  # ─────────────────────────────────────────────────────────────────────────────
  # REVERSE PROXY (Nginx)
  # ─────────────────────────────────────────────────────────────────────────────
  proxy:
    image: nginx:alpine
    container_name: hermes-proxy
    restart: unless-stopped
    networks:
      - litellm_default
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.htpasswd-tim:/etc/nginx/.htpasswd-tim:ro
      - ./.htpasswd-chrisann:/etc/nginx/.htpasswd-chrisann:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M

  # ─────────────────────────────────────────────────────────────────────────────
  # NTFY — Self-Hosted Push Notifications
  # Topics:  hermes-tim      → Tim's agent notifications
  #          hermes-chrisann → Chrisann's agent notifications
  # iOS app: install 'ntfy' from App Store, subscribe to:
  #          https://ntfy.villagertim.com/hermes-tim
  #          https://ntfy.villagertim.com/hermes-chrisann
  # Agent usage:
  #   curl -d "Message here" https://ntfy.villagertim.com/hermes-tim
  #   curl -d "Message here" http://ntfy/hermes-tim  (internal, faster)
  # ─────────────────────────────────────────────────────────────────────────────
  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    command: serve
    environment:
      - NTFY_BASE_URL=https://ntfy.villagertim.com
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_BEHIND_PROXY=true
      # Required for iOS push notifications on self-hosted servers.
      # Relays APNs wake-up signals through ntfy.sh (no account needed).
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
      - TZ=America/New_York
    volumes:
      - ./data/ntfy:/var/lib/ntfy
    restart: unless-stopped
    networks:
      - litellm_default
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M

  # ─────────────────────────────────────────────────────────────────────────────
  # CLOUDFLARE TUNNEL
  # ─────────────────────────────────────────────────────────────────────────────
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    networks:
      - litellm_default
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  litellm_default:
    external: true

secrets:
  litellm_master_key:
    file: ./secrets/litellm_master_key

