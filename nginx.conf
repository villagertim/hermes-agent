events {}

http {
    # ─────────────────────────────────────────────────────────────────────────────
    # TIM'S PERSONAL WEBSITE (villagertim.com)
    # ─────────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name villagertim.com www.villagertim.com;

        location / {
            proxy_pass http://villagertim-web:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ─────────────────────────────────────────────────────────────────────────────
    # CHRISANN'S PERSONAL WEBSITE (villagerchrisann.com)
    # ─────────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name villagerchrisann.com www.villagerchrisann.com;

        location / {
            proxy_pass http://villagerchrisann-web:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ─────────────────────────────────────────────────────────────────────────────
    # CHRISANN'S AI AGENT (agent.villagerchrisann.com)
    # ─────────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name agent.villagerchrisann.com;
        auth_basic "Chrisann's Hermes Agent";
        auth_basic_user_file /etc/nginx/.htpasswd-chrisann;

        location / {
            proxy_pass http://agent-chrisann-dashboard:9119;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ─────────────────────────────────────────────────────────────────────────────
    # CHRISANN'S OBSIDIAN VAULT (notes.villagerchrisann.com)
    # ─────────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name notes.villagerchrisann.com;
        auth_basic "Chrisann's Obsidian Vault";
        auth_basic_user_file /etc/nginx/.htpasswd-chrisann;

        location / {
            proxy_pass http://obsidian-gui-chrisann:3000;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ─────────────────────────────────────────────────────────────────────────────
    # CHRISANN'S AUTOMATION (automation.villagerchrisann.com)
    # ─────────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name automation.villagerchrisann.com;
        auth_basic "Chrisann's n8n Automation";
        auth_basic_user_file /etc/nginx/.htpasswd-chrisann;

        location / {
            proxy_pass http://n8n-chrisann:5678;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 9119;
        auth_basic "Tim's Hermes Agent";
        auth_basic_user_file /etc/nginx/.htpasswd-tim;

        location / {
            proxy_pass http://agent-tim-dashboard:9119;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 9120;
        auth_basic "Chrisann's Hermes Agent";
        auth_basic_user_file /etc/nginx/.htpasswd-chrisann;

        location / {
            proxy_pass http://agent-chrisann-dashboard:9119;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 9121;
        auth_basic "Tim's Obsidian Vault";
        auth_basic_user_file /etc/nginx/.htpasswd-tim;

        location / {
            proxy_pass http://obsidian-gui-tim:3000;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 9122;
        auth_basic "Chrisann's Obsidian Vault";
        auth_basic_user_file /etc/nginx/.htpasswd-chrisann;

        location / {
            proxy_pass http://obsidian-gui-chrisann:3000;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 9123;
        auth_basic "Tim's n8n Automation";
        auth_basic_user_file /etc/nginx/.htpasswd-tim;

        location / {
            proxy_pass http://n8n-tim:5678;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 9124;
        auth_basic "Chrisann's n8n Automation";
        auth_basic_user_file /etc/nginx/.htpasswd-chrisann;

        location / {
            proxy_pass http://n8n-chrisann:5678;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ─────────────────────────────────────────────────────────────────────────────
    # NTFY — Self-Hosted Push Notifications (ntfy.villagertim.com)
    # Shared server: Tim uses topic 'hermes-tim', Chrisann uses 'hermes-chrisann'
    # ─────────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name ntfy.villagertim.com;

        location / {
            proxy_pass http://ntfy:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Required for ntfy SSE real-time delivery
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
