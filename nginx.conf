        location / {
            proxy_pass http://n8n-chrisann:5678;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ─────────────────────────────────────────────────────────────────────────────
    # NTFY — Self-Hosted Push Notifications (ntfy.villagertim.com)
    # Shared server: Tim uses topic 'hermes-tim', Chrisann uses 'hermes-chrisann'
    # ─────────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name ntfy.villagertim.com;

        location / {
            proxy_pass http://ntfy:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Required for ntfy SSE real-time delivery
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
